spring:
  application:
    name: chat-memory-strategies-spring-ai
  ai:
    openai:
      chat:
        options:
          stream-usage: true
      api-key: ${OPENAI_API_KEY}
  datasource:
    url: jdbc:h2:file:~/chatmemory;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update


logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG

# this config is important inorder to log request and response related info



